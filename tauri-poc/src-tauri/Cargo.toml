[package]
name = "lolping-tauri-poc"
version = "0.0.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Serve the embedded pages instead of a dev server, which is what the tauri CLI turns on for a release build.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Tauri's size settings: https://v2.tauri.app/concept/size/
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
