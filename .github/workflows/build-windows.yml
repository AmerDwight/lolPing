name: Build Windows

# Builds the portable .exe on demand and keeps it as a workflow artifact, without publishing a release.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:helper
      # Reported, but a slow runner timing out a PDF or zip parsing test must not stop the build; CI on main still gates them.
      - run: npm test
        continue-on-error: true
      # `npm run dist` with only the portable target: the installer is the release workflow's job.
      - run: npm run build:helper
      - run: npx electron-vite build
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lolPing-portable
          path: release/lolPing-*-portable.exe
          if-no-files-found: error
